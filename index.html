<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYRE — Fundas & Auriculares</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: #07090e;
      color: #ddeeff;
      line-height: 1.6;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { background: #142040; border-radius: 2px; }

    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
    @keyframes floatY { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
    @keyframes marquee { from{ transform:translateX(0); } to{ transform:translateX(-33.333%); } }
    @keyframes scrollDown {
      0%{ transform:scaleY(0); transform-origin:top; }
      50%{ transform:scaleY(1); transform-origin:top; }
      51%{ transform:scaleY(1); transform-origin:bottom; }
      100%{ transform:scaleY(0); transform-origin:bottom; }
    }
    @keyframes toastIn { from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
    @keyframes fadeInUp { from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
    @keyframes spin { to{ transform:rotate(360deg); } }
    @keyframes imgFade { from{ opacity:0; } to{ opacity:1; } }
    @keyframes slideGlow { 0%,100%{ box-shadow:0 0 40px rgba(30,144,255,0.08); } 50%{ box-shadow:0 0 80px rgba(30,144,255,0.18); } }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -100% center; }
    }
    @keyframes shimmer-hero-word {
      0%   { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    /* Para letras sueltas (V del logo) */
    .shimmer-text {
      display: inline-block;
      background: linear-gradient(90deg, #1e90ff 0%, #90d0ff 30%, #ddeeff 50%, #90d0ff 70%, #1e90ff 100%);
      background-size: 400% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 18s linear infinite;
    }
    /* Shimmer secuencial para las 3 palabras del hero (sin repeat, un solo destello por ciclo) */
    .hero-word-shimmer {
      display: inline-block;
      background: linear-gradient(90deg,
        #ddeeff 0%, #ddeeff 48%,
        #90d0ff 49%, #c4e8ff 49.5%, #ffffff 50%, #c4e8ff 50.5%, #90d0ff 51%,
        #ddeeff 52%, #ddeeff 100%
      );
      background-size: 1000% auto;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer-hero-word 12s linear infinite;
    }
    /* Para oraciones completas — el haz viaja de punta a punta */
    .shimmer-line {
      display: inline-block;
      background: linear-gradient(90deg,
        #ddeeff 0%,
        #ddeeff 20%,
        #90d0ff 32%,
        #1e90ff 40%,
        #c4e8ff 47%,
        #1e90ff 54%,
        #90d0ff 62%,
        #ddeeff 75%,
        #ddeeff 100%
      );
      background-size: 600% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 24s linear infinite;
    }
    .loader-logo .v {
      display: inline-block;
      background: linear-gradient(90deg, #1e90ff 0%, #90d0ff 30%, #ddeeff 50%, #90d0ff 70%, #1e90ff 100%);
      background-size: 400% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 8s linear infinite;
    }

    #loader {
      position: fixed; inset: 0; background: #07090e;
      z-index: 9999; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-inner { text-align: center; }
    .loader-logo { display: block; font-size: 2.2rem; font-weight: 800; letter-spacing: 0.16em; margin-bottom: 32px; }
    .loader-logo .yre { color: #ddeeff; }
    .loader-bar { width: 180px; height: 1px; background: #0e1830; border-radius: 1px; overflow: hidden; margin: 0 auto; }
    .loader-fill { height: 100%; background: linear-gradient(90deg, #1e90ff, #ddeeff); width: 0%; transition: width 0.05s linear; }

    @media (max-width: 768px) {
      .nav-desktop { display: none !important; }
      .nav-hamburger { display: flex !important; }
    }
    @media (max-width: 1024px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .hero-visual-col { display: none !important; }
      .features-grid { grid-template-columns: repeat(2,1fr) !important; }
      .products-grid { grid-template-columns: 1fr !important; }
      .about-grid { grid-template-columns: 1fr !important; }
      .about-visual { display: none !important; }
      .testimonials-grid { grid-template-columns: 1fr !important; }
      .contact-grid { grid-template-columns: 1fr !important; }
      .checkout-grid { grid-template-columns: 1fr !important; }
      .product-detail-grid { grid-template-columns: 1fr !important; }
    }

    #scrollTop {
      position: fixed; bottom: 28px; right: 28px;
      width: 42px; height: 42px; border-radius: 50%;
      background: #090c20; border: 1px solid #142040;
      color: #5a7898; font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: all 0.3s; z-index: 400;
    }
    #scrollTop.visible { opacity: 1; pointer-events: all; }
    #scrollTop:hover { background: #1e90ff; color: #07090e; border-color: #1e90ff; }
  </style>
</head>
<body>

<div id="loader">
  <div class="loader-inner">
    <span class="loader-logo"><span class="v">V</span><span class="yre">YRE</span></span>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
  </div>
</div>

<button id="scrollTop" aria-label="Volver arriba" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <i class="fas fa-chevron-up"></i>
</button>

<div id="root"></div>

<script>
  const loaderFill = document.getElementById('loaderFill');
  const loader = document.getElementById('loader');
  let prog = 0;
  const iv = setInterval(() => {
    prog += Math.random() * 16;
    if (prog >= 100) { prog = 100; clearInterval(iv); loaderFill.style.width = '100%'; setTimeout(() => loader.classList.add('hidden'), 400); }
    loaderFill.style.width = prog + '%';
  }, 70);
  window.addEventListener('scroll', () => {
    document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 500);
  });
</script>

<!-- STORE -->
<script type="text/babel">
const { createContext, useContext, useState, useEffect, useCallback } = React;
const AppContext = createContext(null);

const IPHONE_MODELS = [
  'iPhone 17',
  'iPhone 16',
  'iPhone 16 Pro',
  'iPhone 15 (6.1")',
  'iPhone 15 Pro (6.1")',
  'iPhone 14 Pro Max (6.7")',
  'iPhone 14 Pro (6.1")',
  'iPhone 13',
  'iPhone 13 Pro',
  'iPhone 12',
];

const PRODUCTS = [
  {
    id: 'funda-iphone',
    name: 'Funda iPhone',
    category: 'Fundas iPhone',
    price: 6000,
    badge: 'Más vendida',
    description: 'Protección slim con acabado mate premium. Compatible con 10 modelos de iPhone.',
    longDesc: 'La funda VYRE combina transparencia cristalina con protección de nivel profesional. Su material TPU de alta densidad absorbe impactos y resiste los golpes del día a día. Disponible para iPhone 12 hasta iPhone 17, cada unidad está fabricada con corte exacto para tu modelo.',
    features: ['Material TPU premium', 'Bordes elevados para pantalla y cámara', 'Acabado mate antihuellas', 'Compatible con 10 modelos de iPhone', 'Cortes precisos para botones y cámaras'],
    colors: ['Transparente'],
    models: IPHONE_MODELS,
    icon: 'fa-mobile-alt',
    slug: 'funda-iphone',
    images: ['uploads/pasted-1777048486207-0.png', 'uploads/pasted-1777048504179-0.png'],
    heroImage: 'uploads/pasted-1777048504179-0.png',
  },
  { id:'vyre-air', name:'VYRE Air TWS', category:'Auriculares', price:12500, badge:'Top ventas', description:'True Wireless con estuche transparente LED y sonido premium.', longDesc:'Los VYRE Air redefinen lo que esperás de auriculares inalámbricos. Con estuche transparente con display LED, Bluetooth 5.3 y cancelación de ruido activa, ofrecen una experiencia de audio que rivaliza con marcas del triple de precio.', features:['Bluetooth 5.3','Autonomía 8h + 24h estuche LED','Cancelación de ruido activa','IPX4 resistente al agua'], colors:['Negro','Rosa','Azul','Verde'], icon:'fa-headphones', slug:'vyre-air', images:['uploads/Captura de pantalla 2026-04-24 133527.png','uploads/Captura de pantalla 2026-04-24 133628.png','uploads/Captura de pantalla 2026-04-24 133544.png','uploads/Captura de pantalla 2026-04-24 133556.png','uploads/Captura de pantalla 2026-04-24 133551.png','uploads/Captura de pantalla 2026-04-24 133607.png'], heroImage:'uploads/Captura de pantalla 2026-04-24 133527.png' },
];

function AppProvider({ children }) {
  const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem('vyre_cart') || '[]'); } catch { return []; } });
  const [wishlist, setWishlist] = useState(() => { try { return JSON.parse(localStorage.getItem('vyre_wish') || '[]'); } catch { return []; } });
  const [route, setRoute] = useState(window.location.hash || '#/');
  const [cartOpen, setCartOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  useEffect(() => { localStorage.setItem('vyre_cart', JSON.stringify(cart)); }, [cart]);
  useEffect(() => { localStorage.setItem('vyre_wish', JSON.stringify(wishlist)); }, [wishlist]);
  useEffect(() => {
    const handler = () => { setRoute(window.location.hash || '#/'); window.scrollTo({ top: 0 }); };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const navigate = useCallback((path) => { window.location.hash = path; }, []);
  const addToast = useCallback((msg, type = 'default') => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3200);
  }, []);

  const addToCart = useCallback((product, qty = 1, color = null, model = null) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id && i.color === color && i.model === model);
      if (existing) return prev.map(i => (i.id === product.id && i.color === color && i.model === model) ? { ...i, qty: i.qty + qty } : i);
      return [...prev, { ...product, qty, color, model }];
    });
    setCartOpen(true);
    addToast(`${product.name}${model ? ` (${model})` : ''} agregado al carrito`);
  }, [addToast]);

  const removeFromCart = useCallback((id, color, model) => { setCart(prev => prev.filter(i => !(i.id === id && i.color === color && i.model === model))); }, []);
  const updateQty = useCallback((id, color, model, delta) => {
    setCart(prev => prev.map(i => {
      if (i.id === id && i.color === color && i.model === model) { const newQty = i.qty + delta; return newQty < 1 ? null : { ...i, qty: newQty }; }
      return i;
    }).filter(Boolean));
  }, []);

  const toggleWishlist = useCallback((product) => {
    setWishlist(prev => {
      const inWishlist = prev.find(i => i.id === product.id);
      if (inWishlist) { addToast('Eliminado de favoritos'); return prev.filter(i => i.id !== product.id); }
      addToast('Agregado a favoritos ♡', 'heart');
      return [...prev, product];
    });
  }, [addToast]);

  const cartTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const cartCount = cart.reduce((s, i) => s + i.qty, 0);
  const wishCount = wishlist.length;

  return (
    <AppContext.Provider value={{ cart, wishlist, route, navigate, addToCart, removeFromCart, updateQty, toggleWishlist, cartOpen, setCartOpen, toasts, addToast, cartTotal, cartCount, wishCount, PRODUCTS }}>
      {children}
    </AppContext.Provider>
  );
}

const useApp = () => useContext(AppContext);
</script>

<!-- LAYOUT -->
<script type="text/babel">
function Toast({ msg, type }) {
  return (
    <div style={{ background: type==='heart'?'#1a1410':'#0c1025', border:`1px solid ${type==='heart'?'#1e90ff44':'#1e3055'}`, color:type==='heart'?'#1e90ff':'#ddeeff', borderRadius:'100px', padding:'11px 24px', fontSize:'0.8rem', fontWeight:500, letterSpacing:'0.02em', boxShadow:'0 8px 32px rgba(0,0,0,0.5)', whiteSpace:'nowrap', animation:'toastIn 0.3s cubic-bezier(0.4,0,0.2,1)' }}>{msg}</div>
  );
}

function ToastContainer({ toasts }) {
  return (
    <div style={{ position:'fixed', bottom:32, left:'50%', transform:'translateX(-50%)', zIndex:9999, display:'flex', flexDirection:'column', gap:8, alignItems:'center', pointerEvents:'none' }}>
      {toasts.map(t => <Toast key={t.id} msg={t.msg} type={t.type} />)}
    </div>
  );
}

  const { cart, cartOpen, setCartOpen, cartTotal, cartCount, removeFromCart, updateQty, navigate } = useApp();
  return (
    <>
      <div onClick={() => setCartOpen(false)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', backdropFilter:'blur(6px)', zIndex:700, opacity:cartOpen?1:0, pointerEvents:cartOpen?'all':'none', transition:'opacity 0.4s ease' }} />
      <div style={{ position:'fixed', top:0, right:0, bottom:0, width:400, background:'#08091c', borderLeft:'1px solid #142040', zIndex:800, display:'flex', flexDirection:'column', transform:cartOpen?'translateX(0)':'translateX(100%)', transition:'transform 0.45s cubic-bezier(0.4,0,0.2,1)' }}>
        <div style={{ padding:'24px', borderBottom:'1px solid #142040', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.16em', color:'#5a7898', textTransform:'uppercase', marginBottom:4 }}>Tu selección</div>
            <div style={{ fontSize:'1rem', fontWeight:600, color:'#ddeeff' }}>Carrito {cartCount > 0 && <span style={{ color:'#1e90ff' }}>({cartCount})</span>}</div>
          </div>
          <button onClick={() => setCartOpen(false)} style={{ background:'none', border:'1px solid #142040', color:'#5a7898', cursor:'pointer', width:36, height:36, borderRadius:'50%', fontSize:'0.9rem', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.2s' }}
            onMouseEnter={e => { e.currentTarget.style.borderColor='#333'; e.currentTarget.style.color='#ddeeff'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor='#142040'; e.currentTarget.style.color='#5a7898'; }}>
            <i className="fas fa-times" />
          </button>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:'20px 24px', display:'flex', flexDirection:'column', gap:12 }}>
          {cart.length === 0 ? (
            <div style={{ margin:'auto', textAlign:'center', color:'#333' }}>
              <i className="fas fa-shopping-bag" style={{ fontSize:'2.5rem', marginBottom:16, display:'block', opacity:0.3 }} />
              <p style={{ fontSize:'0.88rem' }}>Tu carrito está vacío</p>
            </div>
          ) : cart.map((item, i) => (
            <div key={i} style={{ background:'#111', border:'1px solid #142040', borderRadius:14, padding:16, display:'flex', gap:14, alignItems:'center' }}>
              <div style={{ width:52, height:52, background:'#161616', borderRadius:10, overflow:'hidden', flexShrink:0 }}>
                {item.heroImage ? <img src={item.heroImage} alt={item.name} style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', color:'#333' }}><i className={`fas ${item.icon||'fa-box'}`} style={{ fontSize:'1.3rem' }} /></div>}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:'0.85rem', fontWeight:600, color:'#ddeeff', marginBottom:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{item.name}</div>
                {(item.model || item.color) && <div style={{ fontSize:'0.7rem', color:'#5a7898', marginBottom:6 }}>{[item.model, item.color].filter(Boolean).join(' · ')}</div>}
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <button onClick={() => updateQty(item.id, item.color, item.model, -1)} style={{ width:24, height:24, borderRadius:'50%', border:'1px solid #1e3055', background:'none', color:'#5a7898', cursor:'pointer', fontSize:'0.75rem', display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
                  <span style={{ fontSize:'0.82rem', color:'#ddeeff', minWidth:16, textAlign:'center' }}>{item.qty}</span>
                  <button onClick={() => updateQty(item.id, item.color, item.model, 1)} style={{ width:24, height:24, borderRadius:'50%', border:'1px solid #1e3055', background:'none', color:'#5a7898', cursor:'pointer', fontSize:'0.75rem', display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
                </div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div style={{ fontSize:'0.88rem', fontWeight:700, color:'#1e90ff', marginBottom:8 }}>${(item.price*item.qty).toLocaleString('es-AR')}</div>
                <button onClick={() => removeFromCart(item.id, item.color, item.model)} style={{ background:'none', border:'none', color:'#333', cursor:'pointer', fontSize:'0.75rem', transition:'color 0.2s' }}
                  onMouseEnter={e => e.currentTarget.style.color='#f87171'}
                  onMouseLeave={e => e.currentTarget.style.color='#333'}>
                  <i className="fas fa-trash" />
                </button>
              </div>
            </div>
          ))}
        </div>
        {cart.length > 0 && (
          <div style={{ padding:'20px 24px', borderTop:'1px solid #142040', display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span style={{ fontSize:'0.8rem', color:'#5a7898', letterSpacing:'0.06em', textTransform:'uppercase' }}>Total</span>
              <span style={{ fontSize:'1.3rem', fontWeight:800, color:'#ddeeff' }}>${cartTotal.toLocaleString('es-AR')}</span>
            </div>
            <button onClick={() => { setCartOpen(false); navigate('#/checkout'); }} style={{ padding:'16px', background:'#ddeeff', color:'#07090e', border:'none', borderRadius:12, fontSize:'0.88rem', fontWeight:700, cursor:'pointer', letterSpacing:'0.04em', transition:'all 0.2s' }}
              onMouseEnter={e => e.currentTarget.style.background='#1e90ff'}
              onMouseLeave={e => e.currentTarget.style.background='#ddeeff'}>
              Continuar compra →
            </button>
            <a href={`https://wa.me/5491100000000?text=Hola! Quiero comprar: ${cart.map(i=>`${i.name} x${i.qty}`).join(', ')}`} target="_blank" rel="noopener noreferrer"
              style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:'13px', background:'transparent', border:'1px solid #142040', borderRadius:12, fontSize:'0.82rem', fontWeight:600, color:'#5a7898', textDecoration:'none', transition:'all 0.2s' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor='#25d366'; e.currentTarget.style.color='#25d366'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='#142040'; e.currentTarget.style.color='#5a7898'; }}>
              <i className="fab fa-whatsapp" /> Comprar por WhatsApp
            </a>
          </div>
        )}
      </div>
    </>
  );
}

function Navbar() {
  const { cartCount, wishCount, cartOpen, setCartOpen, navigate, route } = useApp();
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const handler = () => setScrolled(window.scrollY > 30);
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);
  const links = [{ label:'Inicio', href:'#/' }, { label:'Productos', href:'#productos' }, { label:'Nosotros', href:'#nosotros' }, { label:'Contacto', href:'#contacto' }];
  const handleNavClick = (href) => {
    setMenuOpen(false);
    if (href === '#/') {
      if (window.location.hash !== '#/' && window.location.hash !== '') {
        window.location.hash = '/';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (href.startsWith('#/')) { window.location.hash = href; return; }
    if (route !== '#/' && route !== '') {
      window.location.hash = '/';
      setTimeout(() => { const el = document.querySelector(href); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 300);
      return;
    }
    const el = document.querySelector(href);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  return (
    <>
      <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:500, height:68, display:'flex', alignItems:'center', padding:'0 40px', background:scrolled?'rgba(7,9,14,0.94)':'transparent', backdropFilter:scrolled?'blur(24px)':'none', borderBottom:scrolled?'1px solid #142040':'1px solid transparent', transition:'all 0.5s cubic-bezier(0.4,0,0.2,1)' }}>
        <div style={{ maxWidth:1280, width:'100%', margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <a href="#/" onClick={e => { e.preventDefault(); navigate('#/'); }} style={{ textDecoration:'none', display:'flex', alignItems:'center' }}>
            <img src="uploads/pasted-1777048750254-0.png" alt="VYRE" style={{ height:44, width:'auto', objectFit:'contain' }} onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
            <span style={{ display:'none', fontSize:'1.5rem', fontWeight:800, letterSpacing:'0.06em' }}><span className="shimmer-text">V</span><span style={{ color:'#ddeeff' }}>YRE</span></span>
          </a>
          <ul style={{ display:'flex', gap:44, listStyle:'none', margin:0, padding:0 }} className="nav-desktop">

<script type="text/babel">
function useReveal(threshold = 0.12) {
  const ref = React.useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Slideshow({ images, interval = 5000 }) {
  const [active, setActive] = useState(0);
  useEffect(() => {
    if (!images || images.length <= 1) return;
    const timer = setInterval(() => setActive(i => (i + 1) % images.length), interval);
    return () => clearInterval(timer);
  }, []);
  if (!images || images.length === 0) return null;
  return (
    <>
      {images.map((src, i) => (
        <img
          key={i} src={src} alt=""
          style={{
            position: 'absolute', inset: 0,
            width: '100%', height: '100%',
            objectFit: 'cover',
            opacity: i === active ? 1 : 0,
            transition: 'opacity 2s cubic-bezier(0.4,0,0.2,1)',
          }}
        />
      ))}
    </>
  );
}

const STEPS = ['Envío','Pago','Confirmación'];

function Checkout() {
  const { cart, cartTotal, navigate, addToast } = useApp();
  const [step, setStep] = useState(0);
  const [shipping, setShipping] = useState({ name:'', surname:'', email:'', phone:'', address:'', city:'', province:'', zip:'' });
  const [payment, setPayment] = useState({ method:'card', cardName:'', cardNum:'', expiry:'', cvv:'' });
  const [placing, setPlacing] = useState(false);
  useEffect(() => { window.scrollTo({ top:0 }); }, [step]);
  if (cart.length===0) return <div style={{ minHeight:'80vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:20, color:'#5a7898' }}><i className="fas fa-shopping-bag" style={{ fontSize:'3rem', opacity:0.3 }} /><p>Tu carrito está vacío.</p><button onClick={() => navigate('#/')} style={{ padding:'12px 28px', background:'#ddeeff', color:'#07090e', border:'none', borderRadius:10, fontWeight:600, cursor:'pointer', fontSize:'0.85rem' }}>Ver productos</button></div>;
  const inputS = { background:'#08091c', border:'1px solid #0e1830', borderRadius:10, padding:'13px 16px', color:'#ddeeff', fontSize:'0.88rem', fontFamily:'inherit', outline:'none', width:'100%', boxSizing:'border-box', transition:'border-color 0.2s' };
  const labelS = { display:'block', fontSize:'0.7rem', color:'#5a7898', letterSpacing:'0.08em', marginBottom:7 };
  const Field = ({ label, field, obj, setObj, type='text', placeholder='' }) => (
    <div><label style={labelS}>{label}</label><input type={type} placeholder={placeholder} value={obj[field]} required onChange={e => setObj(p => ({ ...p, [field]:e.target.value }))} style={inputS} onFocus={e => e.target.style.borderColor='#1e90ff44'} onBlur={e => e.target.style.borderColor='#0e1830'} /></div>
  );
  const handleOrder = () => { setPlacing(true); setTimeout(() => navigate('#/confirmation'), 1600); };
  return (
    <div style={{ maxWidth:1100, margin:'0 auto', padding:'120px 40px 100px' }}>
      <button onClick={() => navigate('#/')} style={{ display:'flex', alignItems:'center', gap:8, background:'none', border:'none', color:'#5a7898', cursor:'pointer', fontSize:'0.8rem', marginBottom:40, transition:'color 0.2s', padding:0 }} onMouseEnter={e => e.currentTarget.style.color='#ddeeff'} onMouseLeave={e => e.currentTarget.style.color='#5a7898'}><i className="fas fa-arrow-left" /> Seguir comprando</button>
      <div style={{ display:'flex', alignItems:'center', marginBottom:48 }}>
        {STEPS.map((s,i) => (
          <React.Fragment key={i}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:28, height:28, borderRadius:'50%', background:i<=step?'#1e90ff':'#08091c', border:`1px solid ${i<=step?'#1e90ff':'#142040'}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.7rem', fontWeight:700, color:i<=step?'#07090e':'#283860', transition:'all 0.3s', flexShrink:0 }}>
                {i<step ? <i className="fas fa-check" style={{ fontSize:'0.6rem' }} /> : i+1}
              </div>
              <span style={{ fontSize:'0.78rem', color:i===step?'#ddeeff':'#283860', fontWeight:i===step?600:400, transition:'color 0.3s' }}>{s}</span>
            </div>
            {i<STEPS.length-1 && <div style={{ flex:1, height:1, background:i<step?'#1e90ff44':'#0e1830', margin:'0 16px', transition:'background 0.3s' }} />}
          </React.Fragment>
        ))}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 380px', gap:40, alignItems:'start' }} className="checkout-grid">
        <div>
          {step===0 && (
            <div style={{ animation:'fadeInUp 0.4s ease' }}>
              <h2 style={{ fontSize:'1.3rem', fontWeight:700, color:'#ddeeff', marginBottom:28 }}>Información de envío</h2>
              <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}><Field label="Nombre" field="name" obj={shipping} setObj={setShipping} placeholder="Nombre" /><Field label="Apellido" field="surname" obj={shipping} setObj={setShipping} placeholder="Apellido" /></div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}><Field label="Email" field="email" obj={shipping} setObj={setShipping} type="email" placeholder="tu@email.com" /><Field label="Teléfono" field="phone" obj={shipping} setObj={setShipping} placeholder="+54 11 ..." /></div>
                <Field label="Dirección" field="address" obj={shipping} setObj={setShipping} placeholder="Calle y número" />
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 100px', gap:16 }}><Field label="Ciudad" field="city" obj={shipping} setObj={setShipping} placeholder="Ciudad" /><Field label="Provincia" field="province" obj={shipping} setObj={setShipping} placeholder="Provincia" /><Field label="CP" field="zip" obj={shipping} setObj={setShipping} placeholder="1234" /></div>

            </div>

          {step===1 && (
            <div style={{ animation:'fadeInUp 0.4s ease' }}>
              <h2 style={{ fontSize:'1.3rem', fontWeight:700, color:'#ddeeff', marginBottom:28 }}>Método de pago</h2>
              <div style={{ display:'flex', gap:10, marginBottom:28 }}>

                  <button key={val} onClick={() => setPayment(p => ({ ...p, method:val }))} style={{ flex:1, padding:'14px 12px', border:`1px solid ${payment.method===val?'#1e90ff':'#0e1830'}`, background:payment.method===val?'rgba(30,144,255,0.08)':'#08091c', borderRadius:12, color:payment.method===val?'#1e90ff':'#5a7898', cursor:'pointer', fontSize:'0.78rem', fontWeight:500, transition:'all 0.2s', display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}><i className={`fas ${icon}`} style={{ fontSize:'1.1rem' }} />{label}</button>
                ))}
              </div>
              {payment.method==='card' && <div style={{ display:'flex', flexDirection:'column', gap:16, animation:'fadeInUp 0.3s ease' }}><Field label="Nombre en la tarjeta" field="cardName" obj={payment} setObj={setPayment} placeholder="Como figura en la tarjeta" /><Field label="Número de tarjeta" field="cardNum" obj={payment} setObj={setPayment} placeholder="0000 0000 0000 0000" /><div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}><Field label="Vencimiento" field="expiry" obj={payment} setObj={setPayment} placeholder="MM/AA" /><Field label="CVV" field="cvv" obj={payment} setObj={setPayment} placeholder="123" /></div></div>}
              {payment.method==='transfer' && <div style={{ background:'#08091c', border:'1px solid #0e1830', borderRadius:12, padding:24 }}><p style={{ fontSize:'0.85rem', color:'#5a7898', lineHeight:1.7 }}>Al confirmar tu pedido te enviaremos los datos bancarios por email. Una vez acreditado el pago, despachamos en 24hs.</p></div>}
              {payment.method==='cash' && <div style={{ background:'#08091c', border:'1px solid #0e1830', borderRadius:12, padding:24 }}><p style={{ fontSize:'0.85rem', color:'#5a7898', lineHeight:1.7 }}>Coordinamos la entrega en efectivo por WhatsApp. Solo disponible para Capital Federal y GBA.</p></div>}
              <div style={{ display:'flex', gap:12, marginTop:28 }}>
                <button onClick={() => setStep(0)} style={{ padding:'15px 24px', background:'transparent', border:'1px solid #142040', color:'#5a7898', borderRadius:12, fontSize:'0.85rem', cursor:'pointer', transition:'all 0.2s' }} onMouseEnter={e => { e.currentTarget.style.borderColor='#333'; e.currentTarget.style.color='#ddeeff'; }} onMouseLeave={e => { e.currentTarget.style.borderColor='#142040'; e.currentTarget.style.color='#5a7898'; }}>← Volver</button>
                <button onClick={() => setStep(2)} style={{ flex:1, padding:'15px', background:'#ddeeff', color:'#07090e', border:'none', borderRadius:12, fontSize:'0.88rem', fontWeight:700, cursor:'pointer', transition:'background 0.2s' }} onMouseEnter={e => e.currentTarget.style.background='#1e90ff'} onMouseLeave={e => e.currentTarget.style.background='#ddeeff'}>Revisar pedido →</button>
              </div>
            </div>
          )}
          {step===2 && (
            <div style={{ animation:'fadeInUp 0.4s ease' }}>
              <h2 style={{ fontSize:'1.3rem', fontWeight:700, color:'#ddeeff', marginBottom:28 }}>Revisá tu pedido</h2>
              <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:28 }}>
                <div style={{ background:'#08091c', border:'1px solid #0e1830', borderRadius:14, padding:'20px 22px' }}><div style={{ fontSize:'0.65rem', color:'#5a7898', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:12 }}>Envío a</div><p style={{ color:'#ddeeff', fontSize:'0.9rem', lineHeight:1.6 }}>{shipping.name} {shipping.surname}<br />{shipping.address}, {shipping.city}, {shipping.province} ({shipping.zip})<br />{shipping.email} · {shipping.phone}</p></div>
                <div style={{ background:'#08091c', border:'1px solid #0e1830', borderRadius:14, padding:'20px 22px' }}><div style={{ fontSize:'0.65rem', color:'#5a7898', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:12 }}>Pago</div><p style={{ color:'#ddeeff', fontSize:'0.9rem' }}>{payment.method==='card'?`Tarjeta terminada en ${payment.cardNum.slice(-4)||'****'}`:payment.method==='transfer'?'Transferencia bancaria':'Efectivo (coordinamos por WhatsApp)'}</p></div>
              </div>
              <div style={{ display:'flex', gap:12 }}>
                <button onClick={() => setStep(1)} style={{ padding:'15px 24px', background:'transparent', border:'1px solid #142040', color:'#5a7898', borderRadius:12, fontSize:'0.85rem', cursor:'pointer', transition:'all 0.2s' }} onMouseEnter={e => { e.currentTarget.style.borderColor='#333'; e.currentTarget.style.color='#ddeeff'; }} onMouseLeave={e => { e.currentTarget.style.borderColor='#142040'; e.currentTarget.style.color='#5a7898'; }}>← Volver</button>
                <button onClick={handleOrder} disabled={placing} style={{ flex:1, padding:'15px', background:placing?'#7a6b54':'#1e90ff', color:'#07090e', border:'none', borderRadius:12, fontSize:'0.88rem', fontWeight:700, cursor:placing?'default':'pointer', transition:'all 0.2s', opacity:placing?0.8:1 }}>{placing?'Procesando...':'Confirmar pedido →'}</button>
              </div>
            </div>
          )}
        </div>
        <div style={{ background:'#08091c', border:'1px solid #0e1830', borderRadius:20, padding:24, position:'sticky', top:90 }}>
          <div style={{ fontSize:'0.65rem', color:'#5a7898', letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:18 }}>Resumen</div>
          <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:20 }}>
            {cart.map((item,i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:12 }}>

                <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:'0.82rem', fontWeight:500, color:'#ddeeff', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{item.name}</div>{item.color&&<div style={{ fontSize:'0.7rem', color:'#5a7898' }}>{item.color}</div>}</div>
                <div style={{ fontSize:'0.82rem', fontWeight:600, color:'#1e90ff', flexShrink:0 }}>${(item.price*item.qty).toLocaleString('es-AR')}</div>

          <div style={{ borderTop:'1px solid #0e1830', paddingTop:16, display:'flex', flexDirection:'column', gap:10 }}>

          <button onClick={() => navigate('#/')} style={{ flex:1, padding:'14px', background:'#ddeeff', color:'#07090e', border:'none', borderRadius:12, fontSize:'0.85rem', fontWeight:700, cursor:'pointer', transition:'background 0.2s' }} onMouseEnter={e => e.currentTarget.style.background='#1e90ff'} onMouseLeave={e => e.currentTarget.style.background='#ddeeff'}>Seguir comprando</button>

<!-- APP ROOT -->
<script type="text/babel">
function App() {
  const { route, toasts } = useApp();
  const hash = route.replace('#','').replace(/^\//,'');
  const segments = hash.split('/').filter(Boolean);
  const page = segments[0] || '';
  const param = segments[1] || '';
  let content;
  if (page==='product' && param) content = <ProductDetail slug={param} />;
  else if (page==='checkout') content = <Checkout />;
  else if (page==='confirmation') content = <Confirmation />;
  else if (page==='wishlist') content = <WishlistPage />;
  else content = <HomePage />;
  const showFooter = page!=='checkout' && page!=='confirmation';
  return (
    <div style={{ minHeight:'100vh', background:'#07090e' }}>
      <Navbar />
      <CartSidebar />
      <ToastContainer toasts={toasts} />
      <main>{content}</main>
      {showFooter && <Footer />}
    </div>
  );
}

function Root() {
  return <AppProvider><App /></AppProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
